<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="會考閱讀">
  <link rel="manifest" href="reading.webmanifest">
  <title>📖 會考閱讀助手</title>
  <style>
    :root {
      --bg: #f6f7fb; --card: #ffffff; --ink: #18202f; --muted: #647083;
      --line: #dfe4ec; --primary: #2563eb; --primary-dark: #1e40af;
      --green: #16803c; --red: #c62828; --amber: #b7791f;
      --soft-blue: #eaf2ff; --soft-green: #eaf8ef; --soft-amber: #fff8e6;
      --soft-red: #fdecec;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
      line-height: 1.5;
    }
    .app { width: min(100%, 820px); margin: 0 auto; padding: 14px 12px 60px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin: 12px 0; }
    h1 { font-size: 1.5rem; margin: 6px 0 2px; text-align: center; }
    .subtitle { text-align: center; color: var(--muted); font-size: .92rem; margin: 0 0 6px; }
    label, .label { display: block; font-weight: 700; margin: 10px 0 5px; }
    input, select, button, textarea { font: inherit; }
    input, select, textarea {
      width: 100%; min-height: 46px; border: 1px solid var(--line);
      border-radius: 12px; padding: 10px 12px; background: #fff; color: var(--ink);
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid rgba(37,99,235,.22); border-color: var(--primary); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; min-height: 50px; border: none; border-radius: 14px;
      background: var(--primary); color: #fff; font-weight: 800; font-size: 1.02rem;
      cursor: pointer; padding: 10px 14px; margin-top: 10px;
    }
    .btn:active { background: var(--primary-dark); }
    .btn.ghost { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
    .btn.soft { background: var(--soft-blue); color: var(--primary-dark); }
    .btn.green { background: var(--green); }
    .btn:disabled { opacity: .55; cursor: default; }
    .btn.small { width: auto; min-height: 38px; padding: 6px 12px; font-size: .9rem; margin-top: 0; border-radius: 10px; }

    /* 頂部分頁 */
    .nav { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin: 8px 0 4px; }
    .nav button {
      border: 1px solid var(--line); background: #fff; border-radius: 12px;
      padding: 10px 4px; color: var(--ink); font-weight: 800; cursor: pointer; min-height: 46px;
    }
    .nav button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .spacer { flex: 1; }
    .pill { display: inline-block; background: var(--soft-blue); color: var(--primary-dark); border-radius: 999px; padding: 3px 10px; font-size: .82rem; font-weight: 700; }
    .hint { color: var(--muted); font-size: .88rem; }
    .hidden { display: none !important; }

    /* 文章 */
    .article-title { font-size: 1.25rem; font-weight: 800; margin: 4px 0 10px; }
    .article { font-size: 1.15rem; line-height: 1.95; }
    .article p { margin: 0 0 12px; }
    .w { cursor: pointer; border-radius: 4px; padding: 0 1px; transition: background .1s; }
    .w:active { background: var(--soft-blue); }
    .w.glossary { border-bottom: 2px dotted var(--amber); }
    .w.marked { background: #fff2b8; border-bottom: 2px solid var(--amber); }

    .section-title { font-weight: 800; font-size: 1.05rem; margin: 4px 0 8px; display:flex; align-items:center; gap:6px; }
    .gl-item, .gr-item { border-top: 1px solid var(--line); padding: 10px 0; }
    .gl-item:first-child, .gr-item:first-child { border-top: none; }
    .gl-word { font-weight: 800; }
    .gl-pos { color: var(--muted); font-size: .85rem; margin-left: 6px; }
    .gl-ex { color: var(--muted); font-style: italic; font-size: .95rem; margin-top: 2px; }

    /* 測驗 */
    .q { border-top: 1px solid var(--line); padding: 12px 0; }
    .q:first-child { border-top: none; }
    .q-text { font-weight: 700; margin-bottom: 8px; }
    .opt { display: flex; align-items: flex-start; gap: 8px; border: 1px solid var(--line);
      border-radius: 12px; padding: 10px 12px; margin: 6px 0; cursor: pointer; background:#fff; }
    .opt input { width: auto; min-height: 0; margin-top: 3px; }
    .opt.correct { background: var(--soft-green); border-color: var(--green); }
    .opt.wrong { background: var(--soft-red); border-color: var(--red); }
    .explain { background: var(--soft-amber); border-radius: 12px; padding: 10px 12px; margin-top: 8px; font-size: .95rem; }

    /* 生字本 */
    .vocab-row { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding: 10px 0; }
    .vocab-row:first-child { border-top: none; }
    .vocab-main { flex: 1; min-width: 0; }
    .vocab-word { font-weight: 800; }
    .vocab-zh { color: var(--muted); font-size: .92rem; }
    .status-tag { font-size: .78rem; font-weight: 800; border-radius: 999px; padding: 2px 9px; }
    .status-new { background: var(--soft-amber); color: var(--amber); }
    .status-known { background: var(--soft-green); color: var(--green); }

    /* 彈出視窗（點字/查意思） */
    .sheet-bg { position: fixed; inset: 0; background: rgba(20,25,40,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
    .sheet { background: #fff; width: min(100%, 520px); border-radius: 20px 20px 0 0; padding: 18px 18px 26px; animation: up .18s ease; }
    @keyframes up { from { transform: translateY(30px); opacity: .5; } to { transform: none; opacity: 1; } }
    .sheet h3 { margin: 0 0 2px; font-size: 1.35rem; }
    .sheet .zh { font-size: 1.1rem; margin: 8px 0; }
    .close-x { position: absolute; }

    .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
      background: #18202f; color: #fff; padding: 10px 16px; border-radius: 999px;
      font-weight: 700; z-index: 80; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: .95; }
    /* 週曆打卡 */
    .day-tabs { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; margin: 6px 0 4px; }
    .day-tab { border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 8px 2px; text-align: center; font-weight: 800; font-size: .9rem; }
    .day-tab small { display:block; font-weight:600; color: var(--muted); font-size:.7rem; }
    .day-tab.today { border-color: var(--primary); }
    .day-tab.done { background: var(--soft-green); border-color: var(--green); color: var(--green); }
    .day-tab.done::after { content: " ✓"; }

    /* 段落翻譯 */
    .para-wrap { margin: 0 0 12px; }
    .para-wrap p { margin: 0; }
    .tr-btn { margin-top: 4px; font-size: .82rem; color: var(--primary); background: none; border: none; cursor: pointer; padding: 2px 0; font-weight: 700; }
    .tr-zh { background: var(--soft-blue); border-radius: 10px; padding: 8px 12px; margin-top: 6px; font-size: 1.02rem; color: var(--primary-dark); }

    .loading { text-align: center; color: var(--muted); padding: 18px; }
    .spin { display:inline-block; width:18px; height:18px; border:3px solid var(--line);
      border-top-color: var(--primary); border-radius:50%; animation: sp .8s linear infinite; vertical-align:-4px; margin-right:6px;}
    @keyframes sp { to { transform: rotate(360deg); } }
    .err { background: var(--soft-red); color: var(--red); border-radius: 12px; padding: 10px 12px; margin: 8px 0; font-size:.92rem; }
  </style>
</head>
<body>
  <div class="app">
    <h1>📖 會考閱讀助手</h1>
    <p class="subtitle">讀文章 · 點字查意思 · 圈出不會的字 · 練閱讀測驗</p>

    <!-- 設定列 -->
    <div class="card" id="settingsCard">
      <div class="row">
        <span class="label" style="margin:0">👦 目前小孩</span>
        <select id="childSel" style="flex:1; width:auto;">
          <option>彭威翰</option><option>彭恩宣</option><option>彭威朗</option>
        </select>
        <button class="btn small ghost" id="gearBtn" type="button">⚙️ 後端設定</button>
      </div>
      <div id="urlBox" class="hidden">
        <label>後端網址（Apps Script Web App URL）</label>
        <input id="urlInput" placeholder="https://script.google.com/macros/s/xxxx/exec" inputmode="url">
        <div class="row" style="margin-top:8px">
          <button class="btn small" id="saveUrlBtn" type="button">儲存</button>
          <button class="btn small soft" id="testBtn" type="button">測試連線</button>
          <span class="hint" id="urlStatus"></span>
        </div>
      </div>
    </div>

    <!-- 分頁 -->
    <div class="nav">
      <button data-tab="gen" class="active">📝 出文章</button>
      <button data-tab="read">📖 讀文章</button>
      <button data-tab="vocab">📓 生字本</button>
    </div>

    <!-- 出文章 -->
    <section id="tab-gen">
      <div class="card" id="checkCard">
        <div class="section-title">📅 今日閱讀打卡（<span id="checkChildName"></span>）</div>
        <div class="day-tabs" id="weekTabs"></div>
        <button class="btn green" id="checkBtn" type="button">✅ 今日完成閱讀</button>
        <div class="hint" id="checkStatus" style="text-align:center;margin-top:8px"></div>
      </div>
      <div class="card">
        <label>選主題</label>
        <select id="topicSel">
          <option>校園生活</option><option>日常生活</option><option>家庭</option>
          <option>旅遊</option><option>環保與自然</option><option>科技與網路</option>
          <option>運動與健康</option><option>飲食</option><option>節慶與文化</option>
          <option>故事 / 寓言</option><option>動物</option><option>職業與夢想</option>
        </select>
        <label>文章長度</label>
        <div class="grid2">
          <select id="lenSel">
            <option value="短">短（約80字）</option>
            <option value="中" selected>中（約140字）</option>
            <option value="長">長（約200字）</option>
          </select>
          <input id="topicCustom" placeholder="或自己打主題（可留空）">
        </div>
        <button class="btn" id="genBtn" type="button">✨ 出一篇文章</button>
        <div id="genMsg"></div>
      </div>
    </section>

    <!-- 讀文章 -->
    <section id="tab-read" class="hidden">
      <div class="card" id="readerEmpty">
        <p class="hint" style="text-align:center; margin:8px 0;">還沒有文章。先到「📝 出文章」產生一篇 👆</p>
      </div>
      <div id="readerBox" class="hidden">
        <div class="card">
          <div class="article-title" id="artTitle"></div>
          <p class="hint">💡 點任何一個字看中文意思；覺得「這個字我不會」就在彈出視窗按「加入生字本」，字會變黃色。</p>
          <div class="article" id="artBody"></div>
        </div>

        <div class="card">
          <div class="section-title">📘 重點單字</div>
          <div id="glossaryBox"></div>
        </div>

        <div class="card" id="grammarCard">
          <div class="section-title">📐 文法重點</div>
          <div id="grammarBox"></div>
        </div>

        <div class="card">
          <div class="section-title">📝 閱讀測驗</div>
          <div id="quizBox"></div>
          <button class="btn green" id="submitQuizBtn" type="button">✅ 對答案</button>
          <div id="quizResult"></div>
        </div>
      </div>
    </section>

    <!-- 生字本 -->
    <section id="tab-vocab" class="hidden">
      <div class="card">
        <div class="row">
          <div class="section-title" style="margin:0">📓 <span id="vocabChildName"></span> 的生字本</div>
          <span class="spacer"></span>
          <button class="btn small soft" id="reloadVocabBtn" type="button">🔄 重新載入</button>
        </div>
        <div id="vocabList"><div class="loading">載入中…</div></div>
      </div>
      <div class="card">
        <button class="btn" id="startReviewBtn" type="button">🎯 開始生字小考</button>
        <div id="reviewBox"></div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  var LS = {
    url: 'ra_url', child: 'ra_child', article: 'ra_article', cache: 'ra_wordcache'
  };
  var state = {
    url: localStorage.getItem(LS.url) || '',
    child: localStorage.getItem(LS.child) || '彭威翰',
    article: null,
    vocabSet: {},          // { childLower: {word: true} }
    wordCache: {}
  };
  try { state.wordCache = JSON.parse(localStorage.getItem(LS.cache) || '{}'); } catch (e) {}
  try { state.article = JSON.parse(localStorage.getItem(LS.article) || 'null'); } catch (e) {}

  var $ = function (id) { return document.getElementById(id); };
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, 1900);
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  // ---- 後端 API ----
  async function api(action, payload) {
    if (!state.url) throw new Error('尚未設定後端網址（按右上角 ⚙️ 後端設定）');
    var res = await fetch(state.url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 避免 CORS 預檢
      body: JSON.stringify(Object.assign({ action: action }, payload || {}))
    });
    var j;
    try { j = await res.json(); }
    catch (e) { throw new Error('後端回應格式錯誤（可能網址錯或未部署）'); }
    if (!j.ok) throw new Error(j.error || '後端錯誤');
    return j.data;
  }

  // ---- 初始化 UI ----
  $('childSel').value = state.child;
  $('urlInput').value = state.url;
  updateChildLabels();

  $('gearBtn').onclick = function () { $('urlBox').classList.toggle('hidden'); };
  $('childSel').onchange = function () {
    state.child = this.value; localStorage.setItem(LS.child, state.child);
    updateChildLabels(); loadVocab(); loadChecks();
  };
  $('saveUrlBtn').onclick = function () {
    state.url = $('urlInput').value.trim(); localStorage.setItem(LS.url, state.url);
    $('urlStatus').textContent = '已儲存 ✓'; toast('後端網址已儲存');
  };
  $('testBtn').onclick = async function () {
    state.url = $('urlInput').value.trim(); localStorage.setItem(LS.url, state.url);
    $('urlStatus').textContent = '測試中…';
    try {
      var r = await fetch(state.url); var j = await r.json();
      $('urlStatus').textContent = j.ok ? '連線成功 ✅' : '有回應但格式怪';
    } catch (e) { $('urlStatus').textContent = '連線失敗 ✗'; }
  };

  function updateChildLabels() {
    $('vocabChildName').textContent = state.child;
    $('checkChildName').textContent = state.child;
  }

  // ---- 每日閱讀打卡 ----
  function ymd(d) {
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }
  function weekDates() { // 本週一 ~ 週日
    var now = new Date(); var dow = (now.getDay() + 6) % 7; // 週一=0
    var mon = new Date(now); mon.setDate(now.getDate() - dow);
    var out = [];
    for (var i = 0; i < 7; i++) { var d = new Date(mon); d.setDate(mon.getDate() + i); out.push(d); }
    return out;
  }
  var WEEK_LABEL = ['一', '二', '三', '四', '五', '六', '日'];

  function renderWeek(doneSet) {
    var wt = $('weekTabs'); wt.innerHTML = '';
    var today = ymd(new Date());
    weekDates().forEach(function (d, i) {
      var key = ymd(d);
      var el = document.createElement('div');
      el.className = 'day-tab' + (doneSet[key] ? ' done' : '') + (key === today ? ' today' : '');
      el.innerHTML = WEEK_LABEL[i] + '<small>' + (d.getMonth() + 1) + '/' + d.getDate() + '</small>';
      wt.appendChild(el);
    });
    var doneCount = weekDates().filter(function (d) { return doneSet[ymd(d)]; }).length;
    var todayDone = !!doneSet[today];
    $('checkStatus').textContent = '本週完成 ' + doneCount + ' 天' + (todayDone ? '（今天已打卡 ✓）' : '');
    $('checkBtn').textContent = todayDone ? '✓ 今天已完成（再按可取消）' : '✅ 今日完成閱讀';
    $('checkBtn').className = 'btn ' + (todayDone ? 'soft' : 'green');
    $('checkBtn').dataset.done = todayDone ? '1' : '0';
  }

  async function loadChecks() {
    renderWeek(state.checkSet || {}); // 先畫出本週格子
    if (!state.url) { $('checkStatus').textContent = '（設定後端後才能打卡）'; return; }
    try {
      var d = await api('loadChecks', { child: state.child });
      var set = {};
      (d.checks || []).forEach(function (c) {
        if (!c.done) return;
        var key = c.date;
        // 後端可能回 yyyy-MM-dd 或完整日期字串，統一轉成 yyyy-MM-dd
        if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) { var dd = new Date(c.date); if (!isNaN(dd)) key = ymd(dd); }
        set[key] = true;
      });
      state.checkSet = set; renderWeek(set);
    } catch (e) { $('checkStatus').textContent = '打卡紀錄載入失敗（後端可能要更新）'; }
  }

  $('checkBtn').onclick = async function () {
    if (!state.url) { toast('請先設定後端網址'); return; }
    var newDone = $('checkBtn').dataset.done !== '1';
    $('checkBtn').disabled = true;
    try {
      await api('checkIn', { child: state.child, done: newDone });
      await loadChecks();
      toast(newDone ? '今日打卡完成 📅' : '已取消今日打卡');
    } catch (e) { toast('打卡失敗：' + e.message); }
    finally { $('checkBtn').disabled = false; }
  };

  // ---- 分頁切換 ----
  var tabs = document.querySelectorAll('.nav button');
  tabs.forEach(function (b) {
    b.onclick = function () {
      tabs.forEach(function (x){ x.classList.remove('active'); });
      b.classList.add('active');
      ['gen','read','vocab'].forEach(function (t) {
        $('tab-' + t).classList.toggle('hidden', t !== b.dataset.tab);
      });
      if (b.dataset.tab === 'vocab') loadVocab();
    };
  });

  // ---- 出文章 ----
  $('genBtn').onclick = async function () {
    var topic = $('topicCustom').value.trim() || $('topicSel').value;
    var length = $('lenSel').value;
    $('genBtn').disabled = true;
    $('genMsg').innerHTML = '<div class="loading"><span class="spin"></span>Gemini 出題中，約 10-20 秒…</div>';
    try {
      var art = await api('generateArticle', { topic: topic, length: length });
      state.article = art;
      localStorage.setItem(LS.article, JSON.stringify(art));
      $('genMsg').innerHTML = '<div class="card" style="background:var(--soft-green);border-color:var(--green)">✅ 文章好了！切到「📖 讀文章」開始讀。</div>';
      renderReader();
      switchTab('read');
    } catch (e) {
      $('genMsg').innerHTML = '<div class="err">出題失敗：' + esc(e.message) + '</div>';
    } finally { $('genBtn').disabled = false; }
  };

  function switchTab(name) {
    document.querySelector('.nav button[data-tab="' + name + '"]').click();
  }

  // ---- 讀文章 ----
  function vocabKey() { return state.child.toLowerCase(); }
  function isMarked(word) {
    var set = state.vocabSet[vocabKey()] || {};
    return !!set[word.toLowerCase()];
  }
  function addMarkedLocal(word) {
    var k = vocabKey();
    state.vocabSet[k] = state.vocabSet[k] || {};
    state.vocabSet[k][word.toLowerCase()] = true;
  }

  function renderReader() {
    var art = state.article;
    if (!art) { $('readerEmpty').classList.remove('hidden'); $('readerBox').classList.add('hidden'); return; }
    $('readerEmpty').classList.add('hidden');
    $('readerBox').classList.remove('hidden');
    $('artTitle').textContent = art.title || '(未命名)';

    // glossary 對照表（原型 -> 資料）
    var glMap = {};
    (art.glossary || []).forEach(function (g) { if (g.word) glMap[g.word.toLowerCase()] = g; });

    // 文章分段 + 逐字可點 + 每段可翻譯
    var body = $('artBody'); body.innerHTML = '';
    art.trans = art.trans || {};
    (art.article || '').split(/\n+/).forEach(function (para, pIdx) {
      if (!para.trim()) return;
      var wrap = document.createElement('div'); wrap.className = 'para-wrap';
      var p = document.createElement('p');
      var parts = para.match(/[A-Za-z][A-Za-z''\-]*|[^A-Za-z]+/g) || [];
      parts.forEach(function (tok) {
        if (/^[A-Za-z]/.test(tok)) {
          var span = document.createElement('span');
          span.className = 'w';
          span.textContent = tok;
          var low = tok.toLowerCase();
          if (glMap[low]) span.classList.add('glossary');
          if (isMarked(tok)) span.classList.add('marked');
          span.onclick = function () { openWordSheet(tok, para, glMap[low], span); };
          p.appendChild(span);
        } else {
          p.appendChild(document.createTextNode(tok));
        }
      });
      wrap.appendChild(p);

      var trBtn = document.createElement('button'); trBtn.className = 'tr-btn';
      trBtn.textContent = '🈯 翻譯這段';
      var zhDiv = document.createElement('div'); zhDiv.className = 'tr-zh hidden';
      trBtn.onclick = function () {
        if (art.trans[pIdx]) { // 已翻過 → 切換顯示
          zhDiv.classList.toggle('hidden');
          trBtn.textContent = zhDiv.classList.contains('hidden') ? '🈯 翻譯這段' : '🔼 收起翻譯';
          return;
        }
        trBtn.disabled = true; trBtn.textContent = '翻譯中…';
        api('translate', { text: para }).then(function (r) {
          art.trans[pIdx] = r.zh || '';
          localStorage.setItem(LS.article, JSON.stringify(art));
          zhDiv.textContent = art.trans[pIdx];
          zhDiv.classList.remove('hidden');
          trBtn.disabled = false; trBtn.textContent = '🔼 收起翻譯';
        }).catch(function (e) {
          trBtn.disabled = false; trBtn.textContent = '🈯 翻譯這段'; toast('翻譯失敗：' + e.message);
        });
      };
      if (art.trans[pIdx]) { zhDiv.textContent = art.trans[pIdx]; } // 保留已翻譯內容（收合狀態）
      wrap.appendChild(trBtn);
      wrap.appendChild(zhDiv);
      body.appendChild(wrap);
    });

    // 重點單字
    var gb = $('glossaryBox'); gb.innerHTML = '';
    (art.glossary || []).forEach(function (g) {
      var d = document.createElement('div'); d.className = 'gl-item';
      d.innerHTML = '<span class="gl-word">' + esc(g.word) + '</span>' +
        '<span class="gl-pos">' + esc(g.pos || '') + '</span>' +
        '<div>' + esc(g.zh || '') + '</div>' +
        (g.example ? '<div class="gl-ex">' + esc(g.example) + '</div>' : '');
      gb.appendChild(d);
    });

    // 文法
    var grB = $('grammarBox');
    if (art.grammar && art.grammar.length) {
      $('grammarCard').classList.remove('hidden'); grB.innerHTML = '';
      art.grammar.forEach(function (g) {
        var d = document.createElement('div'); d.className = 'gr-item';
        d.innerHTML = '<div class="gl-word">' + esc(g.point || '') + '</div>' +
          '<div>' + esc(g.zh || '') + '</div>' +
          (g.example ? '<div class="gl-ex">' + esc(g.example) + '</div>' : '');
        grB.appendChild(d);
      });
    } else { $('grammarCard').classList.add('hidden'); }

    renderQuiz();
  }

  // 點字彈窗
  function openWordSheet(word, sentence, glInfo, spanEl) {
    var bg = document.createElement('div'); bg.className = 'sheet-bg';
    bg.onclick = function (e) { if (e.target === bg) document.body.removeChild(bg); };
    var sheet = document.createElement('div'); sheet.className = 'sheet';
    sheet.innerHTML = '<h3>' + esc(word) + '</h3><div id="wsBody"><div class="loading"><span class="spin"></span>查詢中…</div></div>';
    bg.appendChild(sheet); document.body.appendChild(bg);

    function fill(info) {
      var marked = isMarked(word);
      $('wsBody').innerHTML =
        '<div class="gl-pos" style="margin-left:0">' + esc(info.pos || '') + '</div>' +
        '<div class="zh">' + esc(info.zh || '(查無)') + '</div>' +
        (info.example ? '<div class="gl-ex">' + esc(info.example) + '</div>' : '') +
        (info.note ? '<div class="hint" style="margin-top:6px">💡 ' + esc(info.note) + '</div>' : '') +
        '<button class="btn ' + (marked ? 'soft' : 'green') + '" id="markBtn" ' + (marked ? 'disabled' : '') + '>' +
        (marked ? '✓ 已在生字本' : '➕ 我不會，加入生字本') + '</button>' +
        '<button class="btn ghost" id="wsClose">關閉</button>';
      $('wsClose').onclick = function () { document.body.removeChild(bg); };
      if (!marked) $('markBtn').onclick = async function () {
        $('markBtn').disabled = true; $('markBtn').textContent = '加入中…';
        try {
          await api('saveVocab', {
            child: state.child, word: word, pos: info.pos || '',
            zh: info.zh || '', example: info.example || '',
            article: (state.article && state.article.title) || '', status: 'new'
          });
          addMarkedLocal(word);
          if (spanEl) spanEl.classList.add('marked');
          toast('已加入生字本 📓');
          $('markBtn').textContent = '✓ 已加入'; $('markBtn').className = 'btn soft';
        } catch (e) { $('markBtn').disabled = false; $('markBtn').textContent = '➕ 我不會，加入生字本'; toast('加入失敗：' + e.message); }
      };
    }

    if (glInfo) { fill(glInfo); return; }
    var cacheKey = word.toLowerCase();
    if (state.wordCache[cacheKey]) { fill(state.wordCache[cacheKey]); return; }
    api('explainWord', { word: word, sentence: sentence })
      .then(function (info) {
        state.wordCache[cacheKey] = info;
        localStorage.setItem(LS.cache, JSON.stringify(state.wordCache));
        fill(info);
      })
      .catch(function (e) { $('wsBody').innerHTML = '<div class="err">查詢失敗：' + esc(e.message) + '</div>' +
        '<button class="btn ghost" onclick="this.parentNode.parentNode.parentNode.remove()">關閉</button>'; });
  }

  // 測驗
  function renderQuiz() {
    var quiz = (state.article && state.article.quiz) || [];
    var box = $('quizBox'); box.innerHTML = ''; $('quizResult').innerHTML = '';
    $('submitQuizBtn').disabled = false;
    quiz.forEach(function (q, qi) {
      var d = document.createElement('div'); d.className = 'q'; d.dataset.qi = qi;
      var html = '<div class="q-text">' + (qi + 1) + '. ' + esc(q.q) + '</div>';
      (q.options || []).forEach(function (opt, oi) {
        html += '<label class="opt"><input type="radio" name="q' + qi + '" value="' + oi + '">' +
          '<span>' + String.fromCharCode(65 + oi) + '. ' + esc(opt) + '</span></label>';
      });
      d.innerHTML = html;
      box.appendChild(d);
    });
  }

  $('submitQuizBtn').onclick = async function () {
    var quiz = (state.article && state.article.quiz) || [];
    if (!quiz.length) return;
    var score = 0;
    quiz.forEach(function (q, qi) {
      var chosen = -1;
      var sel = document.querySelector('input[name="q' + qi + '"]:checked');
      if (sel) chosen = +sel.value;
      var qDiv = document.querySelector('.q[data-qi="' + qi + '"]');
      var opts = qDiv.querySelectorAll('.opt');
      opts.forEach(function (o, oi) {
        o.classList.remove('correct', 'wrong');
        if (oi === q.answer) o.classList.add('correct');
        else if (oi === chosen) o.classList.add('wrong');
      });
      if (chosen === q.answer) score++;
      if (q.zh) {
        var ex = document.createElement('div'); ex.className = 'explain';
        ex.innerHTML = '<b>解析：</b>' + esc(q.zh);
        if (!qDiv.querySelector('.explain')) qDiv.appendChild(ex);
      }
    });
    $('submitQuizBtn').disabled = true;
    $('quizResult').innerHTML = '<div class="card" style="background:var(--soft-blue);text-align:center">' +
      '<b style="font-size:1.2rem">得分 ' + score + ' / ' + quiz.length + '</b></div>';
    try {
      await api('saveReadingLog', {
        child: state.child, topic: state.article.topic || '',
        title: state.article.title || '', score: score, total: quiz.length
      });
      await api('checkIn', { child: state.child, done: true }); // 完成測驗 → 自動打卡
      loadChecks();
    } catch (e) { /* 靜默 */ }
  };

  // ---- 生字本 ----
  async function loadVocab() {
    var box = $('vocabList');
    box.innerHTML = '<div class="loading"><span class="spin"></span>載入中…</div>';
    try {
      var d = await api('loadVocab', { child: state.child });
      var words = d.words || [];
      // 更新本地 marked 集合
      state.vocabSet[vocabKey()] = {};
      words.forEach(function (w) { state.vocabSet[vocabKey()][String(w.word).toLowerCase()] = true; });

      if (!words.length) { box.innerHTML = '<p class="hint" style="text-align:center">還沒有生字。讀文章時點「我不會」就會加進來。</p>'; return; }
      box.innerHTML = '';
      words.reverse().forEach(function (w) {
        var row = document.createElement('div'); row.className = 'vocab-row';
        var known = w.status === 'known';
        row.innerHTML =
          '<div class="vocab-main"><span class="vocab-word">' + esc(w.word) + '</span> ' +
          '<span class="gl-pos">' + esc(w.pos || '') + '</span>' +
          '<div class="vocab-zh">' + esc(w.zh || '') + '</div></div>' +
          '<span class="status-tag ' + (known ? 'status-known' : 'status-new') + '">' + (known ? '已熟' : '要背') + '</span>' +
          '<button class="btn small ' + (known ? 'ghost' : 'soft') + '">' + (known ? '設為要背' : '標為已熟') + '</button>';
        var btn = row.querySelector('button');
        btn.onclick = async function () {
          var newStatus = known ? 'new' : 'known';
          btn.disabled = true;
          try { await api('updateVocab', { child: state.child, word: w.word, status: newStatus }); loadVocab(); }
          catch (e) { btn.disabled = false; toast('更新失敗'); }
        };
        box.appendChild(row);
      });
    } catch (e) {
      box.innerHTML = '<div class="err">載入失敗：' + esc(e.message) + '</div>';
    }
  }
  $('reloadVocabBtn').onclick = loadVocab;

  // 生字小考
  $('startReviewBtn').onclick = async function () {
    var rb = $('reviewBox');
    rb.innerHTML = '<div class="loading"><span class="spin"></span>出題中…</div>';
    $('startReviewBtn').disabled = true;
    try {
      var d = await api('loadVocab', { child: state.child });
      var toStudy = (d.words || []).filter(function (w){ return w.status !== 'known'; })
        .map(function (w){ return { word: w.word, zh: w.zh }; });
      if (!toStudy.length) { rb.innerHTML = '<p class="hint">沒有「要背」的生字，先去讀文章收集吧！</p>'; return; }
      var q = await api('makeQuiz', { words: toStudy });
      renderReview(q.quiz || []);
    } catch (e) { rb.innerHTML = '<div class="err">出題失敗：' + esc(e.message) + '</div>'; }
    finally { $('startReviewBtn').disabled = false; }
  };

  function renderReview(quiz) {
    var rb = $('reviewBox');
    if (!quiz.length) { rb.innerHTML = '<p class="hint">沒題目</p>'; return; }
    rb.innerHTML = '';
    quiz.forEach(function (q, qi) {
      var d = document.createElement('div'); d.className = 'q'; d.dataset.qi = qi;
      var html = '<div class="q-text">' + (qi + 1) + '. ' + esc(q.q) + '</div>';
      (q.options || []).forEach(function (opt, oi) {
        html += '<label class="opt"><input type="radio" name="rq' + qi + '" value="' + oi + '">' +
          '<span>' + String.fromCharCode(65 + oi) + '. ' + esc(opt) + '</span></label>';
      });
      d.innerHTML = html; rb.appendChild(d);
    });
    var btn = document.createElement('button'); btn.className = 'btn green'; btn.textContent = '✅ 對答案';
    btn.onclick = function () {
      var score = 0;
      quiz.forEach(function (q, qi) {
        var sel = document.querySelector('input[name="rq' + qi + '"]:checked');
        var chosen = sel ? +sel.value : -1;
        var qDiv = rb.querySelector('.q[data-qi="' + qi + '"]');
        qDiv.querySelectorAll('.opt').forEach(function (o, oi) {
          if (oi === q.answer) o.classList.add('correct');
          else if (oi === chosen) o.classList.add('wrong');
        });
        if (chosen === q.answer) score++;
      });
      btn.disabled = true;
      var res = document.createElement('div'); res.className = 'card';
      res.style.cssText = 'background:var(--soft-blue);text-align:center';
      res.innerHTML = '<b style="font-size:1.2rem">答對 ' + score + ' / ' + quiz.length + '</b>';
      rb.appendChild(res);
    };
    rb.appendChild(btn);
  }

  // ---- 啟動 ----
  if (state.article) renderReader();
  if (!state.url) $('urlBox').classList.remove('hidden');
  loadChecks();
})();
</script>
</body>
</html>
